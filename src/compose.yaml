services:

  catalogdb:
    image: postgres:15
    container_name: catalogdb

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: CatalogDb

    restart: always

    ports:
      - "5432:5432"

    volumes:
      - postgres_catalog:/var/lib/postgresql/data

  catalog.api:
    container_name: catalog.api
    build:
      context: .
      dockerfile: Service/Catalog/Catalog.API/Dockerfile
      
    depends_on:
      - catalogdb
      
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_HTTPS_PORTS: 8081
      ConnectionStrings__Database: Host=catalogdb;Port=5432;Database=CatalogDb;Username=postgres;Password=postgres;Include Error Detail=true
      
    ports:
      - "6000:8080"
      - "6060:8081"

    volumes:
      - ~/.microsoft/usersecrets:/home/app/.microsoft/usersecrets:ro
      - ~/.aspnet/https:/home/app/.aspnet/https:ro

volumes:
  postgres_catalog: